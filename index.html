<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan de sortie</title>
    <style>
      :root {
        --bg: #fffaf8;
        --panel: rgba(255, 255, 255, 0.76);
        --blush: #f7d7dd;
        --rose: #ef94a5;
        --rose-deep: #d76d83;
        --lavender: #eae0ff;
        --gold: #f1d59b;
        --text: #2c2430;
        --muted: #6d6171;
        --line: rgba(118, 88, 116, 0.14);
        --shadow: 0 20px 50px rgba(112, 69, 86, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(239, 148, 165, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(171, 146, 255, 0.16), transparent 35%),
          linear-gradient(135deg, #fffaf8 0%, #fff8fa 30%, #f9f5ff 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 30px;
      }

      .app {
        width: min(1200px, 100%);
        margin: 0 auto;
        background: rgba(255,255,255,0.52);
        border: 1px solid rgba(255,255,255,0.7);
        box-shadow: var(--shadow);
        border-radius: 28px;
        overflow: hidden;
      }

      .header {
        padding: 26px 30px 18px;
        background: linear-gradient(90deg, rgba(247,215,221,0.8), rgba(234,224,255,0.8));
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.6rem);
        letter-spacing: -0.04em;
      }

      .user-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.55);
        border: 1px solid rgba(118,88,116,0.12);
        border-radius: 999px;
        padding: 8px 12px;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--rose-deep), var(--rose));
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .logout-btn {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.6);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .content {
        display: grid;
        grid-template-columns: 370px minmax(0, 1fr);
        gap: 26px;
        padding: 28px;
      }

      .panel {
        background: rgba(255,255,255,0.76);
        border: 1px solid rgba(139,110,131,0.12);
        border-radius: 22px;
        padding: 22px;
      }

      .duo-box {
        background: linear-gradient(180deg, rgba(247,215,221,0.35), rgba(255,255,255,0.4));
        border: 1px solid rgba(215,109,131,0.15);
        border-radius: 18px;
        padding: 14px;
      }

      .duo-code {
        display: inline-block;
        margin-top: 8px;
        background: rgba(255,255,255,0.75);
        border: 1px dashed rgba(118,88,116,0.18);
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .duo-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .copy-btn,
      .generate-btn {
        border: none;
        background: rgba(215,109,131,0.1);
        color: var(--rose-deep);
        padding: 8px 10px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
      }

      .generate-btn {
        background: rgba(174, 146, 255, 0.14);
        color: #5d4d92;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-weight: 600;
        color: var(--text);
        font-size: 0.92rem;
      }

      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.7);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        outline: none;
      }

      .field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .selection-box {
        background: linear-gradient(180deg, rgba(247,215,221,0.35), rgba(255,255,255,0.4));
        border: 1px solid rgba(215,109,131,0.15);
        border-radius: 18px;
        padding: 14px 14px 12px;
      }

      .selection-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .selection-head span {
        font-weight: 700;
        font-size: 0.94rem;
      }

      .clear-btn {
        border: none;
        background: rgba(215,109,131,0.08);
        color: var(--rose-deep);
        padding: 7px 10px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.78rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 42px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, rgba(231,202,255,0.9), rgba(255,229,196,0.8));
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        border: 1px solid rgba(126,104,170,0.15);
      }

      .chip.empty {
        background: rgba(255,255,255,0.35);
        border: 1px dashed rgba(118,88,116,0.18);
        color: var(--muted);
      }

      .submit-btn {
        border: none;
        background: linear-gradient(135deg, var(--rose-deep), var(--rose));
        color: white;
        padding: 14px 18px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(215,109,131,0.22);
      }

      .calendar-panel { padding: 18px 18px 12px; }
      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .month-label { font-size: clamp(1.3rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.04em; }
      .nav-buttons { display: flex; gap: 8px; }
      .nav-btn {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.75);
        border-radius: 12px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        font-weight: 700;
      }

      .calendar-wrap {
        background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(253,247,250,0.9));
        border: 1px solid rgba(150,120,143,0.12);
        border-radius: 18px;
        padding: 14px;
      }

      .weekdays, .days-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .weekdays { margin-bottom: 8px; }
      .weekdays div {
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 700;
        padding: 8px 0;
      }

      .day {
        position: relative;
        aspect-ratio: 1 / 1;
        border: 1px solid transparent;
        border-radius: 16px;
        background: rgba(255,255,255,0.4);
        display: grid;
        place-items: center;
        font-weight: 700;
        cursor: pointer;
        color: var(--text);
      }

      .day:hover { transform: translateY(-1px); border-color: rgba(215,109,131,0.25); }
      .day.muted { color: rgba(93,77,90,0.42); background: rgba(145,132,142,0.04); }
      .day.selected {
        background: linear-gradient(135deg, rgba(239,148,165,0.9), rgba(234,224,255,0.9));
        color: #2d1d2b;
        border-color: rgba(170,104,124,0.28);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
      }
      .day.today { border-color: rgba(241,213,155,0.9); }

      .summary {
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(255,255,255,0.42);
        border: 1px solid rgba(118,88,116,0.12);
        border-radius: 16px;
        padding: 12px 14px;
      }

      .summary strong {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .summary span { font-weight: 700; }

      @media (max-width: 900px) {
        .content { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        body { padding: 18px; }
        .header, .content { padding-left: 18px; padding-right: 18px; }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>On sort ensemble ?</h1>

        <div class="user-box">
          <div class="avatar" id="avatarInitials">U</div>
          <span id="userName">Utilisateur</span>
          <button type="button" class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>
      </header>

      <main class="content">
        <section class="panel form-box">
          <div class="duo-box">
            <strong>Mon duo</strong>
            <div class="duo-code" id="duoCodeDisplay">—</div>

            <div class="duo-actions">
              <button type="button" class="copy-btn" id="copyDuoBtn">Copier</button>
              <button type="button" class="generate-btn" id="generateDuoBtn">Générer un code duo</button>
            </div>
          </div>

          <div class="field">
            <label for="sortieType">Type de sortie</label>
            <select id="sortieType">
              <option value="Resto / café">Resto / café</option>
              <option value="Balade romantique">Balade romantique</option>
              <option value="Cinéma">Cinéma</option>
              <option value="Concert / spectacle">Concert / spectacle</option>
              <option value="Week-end">Week-end</option>
              <option value="Autre">Autre</option>
            </select>
          </div>

          <div class="field">
            <label for="commentaire">Commentaire</label>
            <textarea id="commentaire" placeholder="Quelques idées, un lieu préféré, ou juste un petit mot doux..."></textarea>
          </div>

          <div class="selection-box">
            <div class="selection-head">
              <span>Mes disponibilités</span>
              <button type="button" class="clear-btn" id="clearDates">Effacer</button>
            </div>
            <div class="chips" id="dateChips">
              <span class="chip empty">Aucune date sélectionnée</span>
            </div>
          </div>

          <button class="submit-btn" type="button" id="submitBtn">Enregistrer mes disponibilités</button>
        </section>

        <section class="panel calendar-panel">
          <div class="calendar-header">
            <div class="month-label" id="monthLabel">Mois</div>
            <div class="nav-buttons">
              <button class="nav-btn" type="button" id="prevMonth" aria-label="Mois précédent">←</button>
              <button class="nav-btn" type="button" id="nextMonth" aria-label="Mois suivant">→</button>
            </div>
          </div>

          <div class="calendar-wrap">
            <div class="weekdays">
              <div>Dim</div>
              <div>Lun</div>
              <div>Mar</div>
              <div>Mer</div>
              <div>Jeu</div>
              <div>Ven</div>
              <div>Sam</div>
            </div>
            <div id="daysGrid" class="days-grid"></div>
          </div>

          <div class="summary">
            <div>
              <strong>Sortie prévue</strong>
              <span id="summaryType">Resto / café</span>
            </div>
            <div>
              <strong>Dates</strong>
              <span id="summaryDates">0 sélection</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const sessionUser = JSON.parse(sessionStorage.getItem("calovedrier_session") || "null");

      if (!sessionUser) {
        window.location.href = "register.html";
      }

      const monthLabel = document.getElementById("monthLabel");
      const daysGrid = document.getElementById("daysGrid");
      const dateChips = document.getElementById("dateChips");
      const clearDatesBtn = document.getElementById("clearDates");
      const sortieType = document.getElementById("sortieType");
      const summaryType = document.getElementById("summaryType");
      const summaryDates = document.getElementById("summaryDates");
      const submitBtn = document.getElementById("submitBtn");
      const commentaire = document.getElementById("commentaire");
      const logoutBtn = document.getElementById("logoutBtn");
      const userName = document.getElementById("userName");
      const avatarInitials = document.getElementById("avatarInitials");
      const duoCodeDisplay = document.getElementById("duoCodeDisplay");
      const copyDuoBtn = document.getElementById("copyDuoBtn");
      const generateDuoBtn = document.getElementById("generateDuoBtn");

      function generateDuoCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 6; i++) {
          code += chars[Math.floor(Math.random() * chars.length)];
        }
        return code;
      }

      function ensureDuoCode() {
        if (!sessionUser.duoCode) {
          const code = generateDuoCode();
          sessionUser.duoCode = code;
          sessionStorage.setItem("calovedrier_session", JSON.stringify(sessionUser));
        }

        duoCodeDisplay.textContent = sessionUser.duoCode;
      }

      userName.textContent = sessionUser?.fullName || "Utilisateur";
      avatarInitials.textContent = (sessionUser?.fullName || "U").charAt(0).toUpperCase();
      ensureDuoCode();

      const selectedDates = new Set();
      let currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

      function formatDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function formatDisplayDate(date) {
        return new Intl.DateTimeFormat("fr-FR", {
          day: "numeric",
          month: "short"
        }).format(date);
      }

      function updateSummary() {
        summaryType.textContent = sortieType.value;
        const count = selectedDates.size;
        summaryDates.textContent = `${count} date${count > 1 ? "s" : ""} sélectionnée${count > 1 ? "s" : ""}`;
      }

      function renderChips() {
        const values = [...selectedDates].sort();

        if (!values.length) {
          dateChips.innerHTML = '<span class="chip empty">Aucune date sélectionnée</span>';
          return;
        }

        const html = values
          .map((dateKey) => {
            const date = new Date(`${dateKey}T12:00:00`);
            return `<span class="chip">${formatDisplayDate(date)}</span>`;
          })
          .join("");

        dateChips.innerHTML = html;
      }

      function renderCalendar() {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startWeekday = firstDay.getDay();
        const prevMonthLast = new Date(year, month, 0).getDate();

        monthLabel.textContent = new Intl.DateTimeFormat("fr-FR", {
          month: "long",
          year: "numeric"
        }).format(currentMonth);

        const cells = [];

        for (let i = startWeekday - 1; i >= 0; i--) {
          const dayNumber = prevMonthLast - i;
          cells.push({ date: new Date(year, month - 1, dayNumber), muted: true });
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
          cells.push({ date: new Date(year, month, day), muted: false });
        }

        const remaining = 42 - cells.length;
        for (let day = 1; day <= remaining; day++) {
          cells.push({ date: new Date(year, month + 1, day), muted: true });
        }

        daysGrid.innerHTML = cells
          .map(({ date, muted }) => {
            const key = formatDateKey(date);
            const isSelected = selectedDates.has(key);
            const today = formatDateKey(new Date()) === key;

            const classes = [
              "day",
              muted ? "muted" : "",
              isSelected ? "selected" : "",
              today ? "today" : ""
            ].filter(Boolean).join(" ");

            return `<button class="${classes}" type="button" data-date="${key}">${date.getDate()}</button>`;
          })
          .join("");

        document.querySelectorAll(".day").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.dataset.date;

            if (selectedDates.has(key)) {
              selectedDates.delete(key);
            } else {
              selectedDates.add(key);
            }

            renderCalendar();
            renderChips();
            updateSummary();
          });
        });
      }

      function getStoredSorties() {
        return JSON.parse(localStorage.getItem("calovedrier_sorties") || "[]");
      }

      function saveStoredSorties(data) {
        const sorties = getStoredSorties();
        sorties.push(data);
        localStorage.setItem("calovedrier_sorties", JSON.stringify(sorties));
      }

      async function saveSortie(payload) {
        try {
          const response = await fetch("/api/sorties", { ...payload });
          if (!response.ok) {
            throw new Error("DB unavailable");
          }
          return await response.json();
        } catch {
          saveStoredSorties(payload);
          return { success: true, mode: "localStorage" };
        }
      }

      function buildPayload() {
        return {
          duoCode: sessionUser.duoCode,
          duoId: sessionUser.duoId || sessionUser.duoCode,
          userId: sessionUser.id,
          userEmail: sessionUser.email,
          type: sortieType.value,
          dates: [...selectedDates].sort(),
          comment: commentaire.value.trim(),
          status: "pending",
          createdAt: new Date().toISOString()
        };
      }

      document.getElementById("prevMonth").addEventListener("click", () => {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
        renderCalendar();
      });

      document.getElementById("nextMonth").addEventListener("click", () => {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
        renderCalendar();
      });

      clearDatesBtn.addEventListener("click", () => {
        selectedDates.clear();
        renderCalendar();
        renderChips();
        updateSummary();
      });

      sortieType.addEventListener("change", updateSummary);

      copyDuoBtn.addEventListener("click", async () => {
        if (!sessionUser?.duoCode) return;
        try {
          await navigator.clipboard.writeText(sessionUser.duoCode);
          alert("Code duo copié : " + sessionUser.duoCode);
        } catch {
          alert("Code duo : " + sessionUser.duoCode);
        }
      });

      generateDuoBtn.addEventListener("click", () => {
        sessionUser.duoCode = generateDuoCode();
        sessionStorage.setItem("calovedrier_session", JSON.stringify(sessionUser));
        duoCodeDisplay.textContent = sessionUser.duoCode;
        alert("Nouveau code duo généré : " + sessionUser.duoCode);
      });

      submitBtn.addEventListener("click", async () => {
        if (selectedDates.size === 0) {
          alert("Choisis au moins une date avant d’enregistrer.");
          return;
        }

        const payload = buildPayload();

        await saveSortie(payload);

        const message =
          `Disponibilités enregistrées pour ${sessionUser.fullName}.` +
          `\nType : ${payload.type}` +
          `\nDates : ${[...payload.dates]
            .map((d) => formatDisplayDate(new Date(`${d}T12:00:00`)))
            .join(", ")}`;

        alert(message);
      });

      logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("calovedrier_session");
        window.location.href = "register.html";
      });

      renderCalendar();
      renderChips();
      updateSummary();
    </script>
  </body>
</html>
